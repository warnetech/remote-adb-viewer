[project]
name = "rav"
version = "0.1.0"
description = "Remote ADB Viewer: one-command remote sessions for TainuiTech"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rav = "rav.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
